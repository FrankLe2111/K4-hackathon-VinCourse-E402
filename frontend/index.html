<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bản demo học tập tương tác VinCourse">
  <title>VinCourse - Học qua trải nghiệm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" data-route="home" aria-label="VinCourse home">
        <span class="brand-mark">V</span>
        <span>VinCourse</span>
      </a>
      <nav class="nav" id="main-nav"></nav>
      <div class="sidebar-footer">
        <div class="mini-profile">
          <div class="avatar" id="side-avatar">LM</div>
          <div>
            <strong id="side-name">Linh Minh</strong>
            <small id="side-role">Học viên khám phá</small>
          </div>
        </div>
        <button class="icon-button" data-action="toggle-role" title="Switch role" aria-label="Switch role">⇄</button>
      </div>
    </aside>

    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button mobile-menu" data-action="toggle-sidebar" aria-label="Open menu">☰</button>
        <div class="top-context">
          <span class="course-dot"></span>
          <div>
            <strong>Nền tảng Học máy</strong>
            <small id="breadcrumb">Thế giới học tập</small>
          </div>
        </div>
        <div class="top-actions">
          <div class="language-switch" aria-label="Chọn ngôn ngữ">
            <button data-language="vi" class="active">VI</button>
            <button data-language="en">EN</button>
          </div>
          <div class="stat-chip"><span>🔥</span><strong>7</strong><small>ngày liên tiếp</small></div>
          <div class="stat-chip"><span>✦</span><strong>1,240</strong><small>XP</small></div>
          <button class="icon-button notification-button" data-action="notifications" aria-label="Notifications">●<span class="notification-dot"></span></button>
          <button class="avatar avatar-button" data-action="toggle-role" aria-label="Profile and role">LM</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
